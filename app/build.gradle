plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.lordfunion.rockboxsolar'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.lordfunion.rockboxsolar'
        minSdk 17
        targetSdk 28
        versionCode 3
        versionName '0.3.0'

        // Innioasis Y1 is a 32-bit ARM device. Keep only the ABI that can run
        // on the target so bundled native dependencies (notably Conscrypt)
        // cannot accidentally ship x86 or 64-bit binaries in the ROM.
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.github.mwiede:jsch:2.28.4'
}
