name: Verify Bluetooth and folder regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run focused Bluetooth regression tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.solar.launcher.BluetoothPairingCoordinatorTest" \
            --tests "com.solar.launcher.BluetoothAudioRepairTest" \
            --tests "com.solar.launcher.BluetoothDiagnosticsTest"

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug
