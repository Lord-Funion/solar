name: Build native Rockbox Solar Y1 firmware

on:
  push:
    branches:
      - agent/rockbox-solar-firmware
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROCKBOX_REF: ec32a663dfb8396080227de03846c30f07dc258d
      ANDROID_SDK_PATH: /home/runner/android-sdk
      ANDROID_NDK_PATH: /home/runner/android-ndk-r10e
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r10e

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Check out pinned Innioasis Y1 Rockbox source
        uses: actions/checkout@v4
        with:
          repository: rockbox-y1/rockbox
          ref: ${{ env.ROCKBOX_REF }}
          path: rockbox-y1
          fetch-depth: 1

      - name: Apply minimal native Solar milestone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 - <<'PY' 2>&1 | tee logs/01-native-integration.log
          from pathlib import Path

          root = Path("rockbox-y1")
          plugin = root / "apps/plugins/solar.c"
          sources = root / "apps/plugins/SOURCES"
          categories = root / "apps/plugins/CATEGORIES"
          main_menu = root / "apps/menus/main_menu.c"
          root_menu = root / "apps/root_menu.c"

          plugin.write_text(r'''/***************************************************************************
           * Solar native integration for the Innioasis Y1 Rockbox port.
           *
           * This milestone deliberately contains no Android Activity launch,
           * no separate Solar APK, and no wrapper UI. It is a native Rockbox
           * plugin using the Y1 Rockbox plugin ABI and existing Y1 Wi-Fi bridge.
           ***************************************************************************/
          #include "plugin.h"

          PLUGIN_HEADER

          static void show_status(void)
          {
              rb->splash(HZ * 3,
                         "Native Solar milestone: Wi-Fi control ready. "
                         "Piped and Deezer are not implemented yet.");
          }

          static void connect_wifi(void)
          {
              const char *result = rb->android_podcast_connect_wifi();
              if (result == NULL)
                  rb->splash(HZ * 2, "Wi-Fi returned no status");
              else
                  rb->splash(HZ * 2, result);
          }

          static void disconnect_wifi(void)
          {
              int result = rb->android_podcast_disconnect_wifi();
              if (result == 0)
                  rb->splash(HZ * 2, "Wi-Fi disconnected");
              else
                  rb->splashf(HZ * 2, "Wi-Fi disconnect error: %d", result);
          }

          enum plugin_status plugin_start(const void *parameter)
          {
              int selection = 0;
              (void)parameter;

              MENUITEM_STRINGLIST(menu, "Solar", NULL,
                                  "Connect Wi-Fi",
                                  "Disconnect Wi-Fi",
                                  "Milestone status");

              while (true)
              {
                  switch (rb->do_menu(&menu, &selection, NULL, false))
                  {
                      case 0:
                          connect_wifi();
                          break;
                      case 1:
                          disconnect_wifi();
                          break;
                      case 2:
                          show_status();
                          break;
                      default:
                          return PLUGIN_OK;
                  }
              }
          }
          ''', encoding="utf-8")

          text = sources.read_text(encoding="utf-8")
          marker = "#if defined(INNIOASIS_Y1)\npodcast_downloader.c\nspeaker_toggle.c\n#endif"
          replacement = "#if defined(INNIOASIS_Y1)\npodcast_downloader.c\nsolar.c\nspeaker_toggle.c\n#endif"
          if marker not in text:
              raise SystemExit("SOURCES insertion point not found")
          sources.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          text = categories.read_text(encoding="utf-8")
          marker = "snow,demos\nsokoban,games"
          if marker not in text:
              raise SystemExit("CATEGORIES insertion point not found")
          categories.write_text(text.replace(marker, "snow,demos\nsolar,apps\nsokoban,games", 1), encoding="utf-8")

          text = main_menu.read_text(encoding="utf-8")
          marker = '''/*    BlUETOOTH SETTINGS MENU     */
          /**********************************/
          #endif

          /***********************************/
          /*      INFO MENU                  */
          '''
          native_menu = '''/*    BlUETOOTH SETTINGS MENU     */
          /**********************************/

          static int solar_native_func(void)
          {
              int result = plugin_load(PLUGIN_APPS_DIR "/solar.rock", NULL);
              if (result != PLUGIN_OK)
                  splash(HZ * 2, "Unable to load native Solar plugin");
              return 0;
          }

          MENUITEM_FUNCTION(solar_native_item, 0, "Solar",
                            solar_native_func, NULL, Icon_Plugin);
          #endif

          /***********************************/
          /*      INFO MENU                  */
          '''
          if marker not in text:
              raise SystemExit("main_menu.c insertion point not found")
          main_menu.write_text(text.replace(marker, native_menu, 1), encoding="utf-8")

          text = root_menu.read_text(encoding="utf-8")
          old = '''#ifdef INNIOASIS_Y1
          extern struct menu_item_ex fm_radio_app_item;
          #endif
          '''
          new = '''#ifdef INNIOASIS_Y1
          extern struct menu_item_ex fm_radio_app_item;
          extern struct menu_item_ex solar_native_item;
          #endif
          '''
          if old not in text:
              raise SystemExit("root_menu.c extern insertion point not found")
          text = text.replace(old, new, 1)

          old = '''#ifdef INNIOASIS_Y1
              { "fm_radio_app", &fm_radio_app_item },
          #endif
              { "plugins", &rocks_browser },
          '''
          new = '''#ifdef INNIOASIS_Y1
              { "fm_radio_app", &fm_radio_app_item },
              { "solar", &solar_native_item },
          #endif
              { "plugins", &rocks_browser },
          '''
          if old not in text:
              raise SystemExit("root_menu.c menu-table insertion point not found")
          root_menu.write_text(text.replace(old, new, 1), encoding="utf-8")

          checks = {
              plugin: ["PLUGIN_HEADER", "android_podcast_connect_wifi", "Piped and Deezer are not implemented yet"],
              sources: ["solar.c"],
              categories: ["solar,apps"],
              main_menu: ["PLUGIN_APPS_DIR \"/solar.rock\"", "solar_native_item"],
              root_menu: ["extern struct menu_item_ex solar_native_item", "{ \"solar\", &solar_native_item }"],
          }
          for path, needles in checks.items():
              data = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f"missing {needle!r} in {path}")

          for path in (plugin, main_menu, root_menu):
              data = path.read_text(encoding="utf-8")
              if "am start" in data or "dev.lordfunion.rockboxsolar" in data:
                  raise SystemExit(f"Android Activity launch leaked into {path}")

          print("Native milestone files applied:")
          for path in checks:
              print(path)
          PY

      - name: Prepare genuine Y1 Rockbox toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee logs/02-apt-update.log
          sudo apt-get install -y lib32z1 openjdk-17-jdk zip unzip wget file binutils e2fsprogs 2>&1 | tee logs/03-apt-install.log
          cd rockbox-y1/android/y1
          set +o pipefail
          yes | ./installToolchain.sh 2>&1 | tee ../../../logs/04-toolchain.log
          toolchain_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$toolchain_status"

      - name: Clean-build native Rockbox and Solar plugin
        shell: bash
        run: |
          set -euo pipefail
          cd rockbox-y1/android/y1
          rm -rf build
          mkdir build
          cd build
          ../../../tools/configure --target=310 --lcdwidth=480 --lcdheight=360 --type=n 2>&1 | tee ../../../../logs/05-configure.log
          make clean 2>&1 | tee ../../../../logs/06-clean.log
          make -j2 2>&1 | tee ../../../../logs/07-build.log
          make zip 2>&1 | tee ../../../../logs/08-zip.log

          test -f libs/armeabi/librockbox.so
          test -f libs/armeabi/libmisc.so
          rm -rf inspect-misc
          mkdir inspect-misc
          (cd inspect-misc && unzip -q ../libs/armeabi/libmisc.so)
          test -f inspect-misc/sdcard/.rockbox/rocks/apps/solar.rock

          file libs/armeabi/librockbox.so inspect-misc/sdcard/.rockbox/rocks/apps/solar.rock | tee ../../../../logs/09-binary-file.log
          readelf -h libs/armeabi/librockbox.so | tee ../../../../logs/10-readelf.log
          strings libs/armeabi/librockbox.so | grep -F "Unable to load native Solar plugin" | tee ../../../../logs/11-menu-string.log
          strings inspect-misc/sdcard/.rockbox/rocks/apps/solar.rock | grep -F "Piped and Deezer are not implemented yet" | tee ../../../../logs/12-plugin-string.log

      - name: Download official Y1 base ROMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware-inputs
          wget -O firmware-inputs/type-a-base-rom.zip \
            https://github.com/rockbox-y1/rockbox/releases/download/type-a-base/rom.zip \
            2>&1 | tee logs/13-type-a-download.log
          wget -O firmware-inputs/type-b-base-rom.zip \
            https://github.com/rockbox-y1/rockbox/releases/download/type-b-base/rom.zip \
            2>&1 | tee logs/14-type-b-download.log
          unzip -tq firmware-inputs/type-a-base-rom.zip | tee logs/15-type-a-test.log
          unzip -tq firmware-inputs/type-b-base-rom.zip | tee logs/16-type-b-test.log

      - name: Package Type A and Type B native firmware
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p dist/type-a dist/type-b

          bundle_rom() {
            variant="$1"
            base_zip="$2"
            work="$ROOT/firmware-work-$variant"
            output="$ROOT/dist/$variant/rom.zip"
            rm -rf "$work"
            mkdir -p "$work" "$work/mount_sys" "$work/mount_user" "$work/libmisc"
            unzip -q "$base_zip" -d "$work"

            cleanup() {
              mountpoint -q "$work/mount_sys" && sudo umount "$work/mount_sys" || true
              mountpoint -q "$work/mount_user" && sudo umount "$work/mount_user" || true
            }
            trap cleanup RETURN

            sudo mount -t ext4 -o loop,rw "$work/system.img" "$work/mount_sys"
            sudo mount -t ext4 -o loop,rw "$work/userdata.img" "$work/mount_user"

            sudo install -D -m 0644 "$ROOT/rockbox-y1/android/y1/build/libs/armeabi/librockbox.so" \
              "$work/mount_sys/lib/librockbox.so"

            sudo rm -rf "$work/mount_user/data/org.rockbox/lib"
            sudo mkdir -p "$work/mount_user/data/org.rockbox/lib"
            sudo cp "$ROOT/rockbox-y1/android/y1/build/libs/armeabi/"* \
              "$work/mount_user/data/org.rockbox/lib/"
            sudo chmod 0755 "$work/mount_user/data/org.rockbox/lib/"*

            (cd "$work/libmisc" && unzip -q "$ROOT/rockbox-y1/android/y1/build/libs/armeabi/libmisc.so")
            test -f "$work/libmisc/sdcard/.rockbox/rocks/apps/solar.rock"

            sudo rm -rf "$work/mount_user/data/org.rockbox/app_rockbox"
            sudo mkdir -p "$work/mount_user/data/org.rockbox/app_rockbox/.rockbox"
            sudo cp -a "$work/libmisc/sdcard/.rockbox/." \
              "$work/mount_user/data/org.rockbox/app_rockbox/.rockbox/"

            sudo test -f "$work/mount_sys/lib/librockbox.so"
            sudo test -f "$work/mount_user/data/org.rockbox/app_rockbox/.rockbox/rocks/apps/solar.rock"
            sudo file "$work/mount_sys/lib/librockbox.so"
            sudo file "$work/mount_user/data/org.rockbox/app_rockbox/.rockbox/rocks/apps/solar.rock"

            sync
            sudo umount "$work/mount_sys"
            sudo umount "$work/mount_user"
            trap - RETURN

            rm -rf "$work/mount_sys" "$work/mount_user" "$work/libmisc"
            (cd "$work" && zip -q -9 -j "$output" ./*)
            unzip -tq "$output"
          }

          bundle_rom type-a "$ROOT/firmware-inputs/type-a-base-rom.zip" 2>&1 | tee logs/17-package-type-a.log
          bundle_rom type-b "$ROOT/firmware-inputs/type-b-base-rom.zip" 2>&1 | tee logs/18-package-type-b.log

      - name: Inspect packaged firmware images
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          for variant in type-a type-b; do
            verify="$ROOT/verify-$variant"
            rm -rf "$verify"
            mkdir -p "$verify/mount_sys" "$verify/mount_user"
            unzip -q "$ROOT/dist/$variant/rom.zip" -d "$verify"

            sudo mount -t ext4 -o loop,ro "$verify/system.img" "$verify/mount_sys"
            sudo mount -t ext4 -o loop,ro "$verify/userdata.img" "$verify/mount_user"

            sudo test -f "$verify/mount_sys/lib/librockbox.so"
            sudo test -f "$verify/mount_user/data/org.rockbox/app_rockbox/.rockbox/rocks/apps/solar.rock"
            sudo strings "$verify/mount_sys/lib/librockbox.so" | grep -F "Unable to load native Solar plugin"
            sudo strings "$verify/mount_user/data/org.rockbox/app_rockbox/.rockbox/rocks/apps/solar.rock" | grep -F "Piped and Deezer are not implemented yet"

            sudo umount "$verify/mount_sys"
            sudo umount "$verify/mount_user"
          done 2>&1 | tee logs/19-image-verification.log

      - name: Write checksums and milestone report
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/type-a/rom.zip dist/type-b/rom.zip | tee dist/SHA256SUMS.txt
          cat > dist/MILESTONE.txt <<EOF
          Native Rockbox Solar milestone
          =================================
          Integration commit: $GITHUB_SHA
          Rockbox Y1 source: $ROCKBOX_REF

          Implemented and built:
          - Native apps/plugins/solar.c Rockbox plugin
          - Native top-level Solar menu entry
          - Functional Wi-Fi connect/disconnect through the existing Y1 Rockbox plugin ABI
          - No Solar APK, Android launcher, Activity, or wrapper UI is built or packaged

          Explicitly not implemented in this milestone:
          - Piped/YouTube search and download
          - Deezer catalog integration
          - SSH/SCP
          - Soulseek
          - Stem separation
          - Physical-device validation

          The Y1 Rockbox port itself remains hosted by the device's existing org.rockbox
          Android runtime from the official base ROM; this build replaces native Rockbox
          binaries and the .rockbox tree, not a separate Solar application.
          EOF
          cp logs/*.log dist/

      - name: Upload firmware and complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rockbox-solar-y1-milestone
          path: |
            dist/
            logs/
          if-no-files-found: warn
          retention-days: 14
