name: Build Rockbox Solar APK

on:
  push:
    branches:
      - agent/rockbox-solar-cleanroom
  pull_request:
    branches:
      - rockbox-solar-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android Lint and preserve status
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug
          status=$?
          echo "$status" > /tmp/rockbox-solar-lint-status
          exit 0

      - name: Package hardware-test files and Lint report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RockboxSolar-v0.3-debug.apk
          cp README.md LICENSE install-y1.sh uninstall-y1.sh dist/
          cp docs/FEATURE-MATRIX.md docs/Y1-HARDWARE-VALIDATION.md dist/
          test -f app/build/reports/lint-results-debug.html && cp app/build/reports/lint-results-debug.html dist/ || true
          test -f app/build/reports/lint-results-debug.txt && cp app/build/reports/lint-results-debug.txt dist/ || true
          (cd dist && sha256sum RockboxSolar-v0.3-debug.apk > SHA256SUMS.txt)
          chmod +x dist/install-y1.sh dist/uninstall-y1.sh
          (cd dist && zip -9 RockboxSolar-v0.3-package.zip ./*)

      - name: Upload APK and Lint package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-solar-v0.3-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Lint gate
        if: always()
        shell: bash
        run: |
          status="$(cat /tmp/rockbox-solar-lint-status)"
          test "$status" -eq 0
