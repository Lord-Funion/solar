name: Build requested Y1 ROM artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-rom:
    if: github.head_ref == 'agent/build-rom-public-keys'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOLAR_Y1A_BASE_ZIP: ${{ vars.SOLAR_Y1A_BASE_ZIP }}
      SOLAR_BASH: /bin/bash
      ProgramFiles: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch restoration compile leftovers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('app/src/main/java/com/solar/launcher/MainActivity.java')
          row_path = Path('app/src/main/java/com/solar/launcher/RowKeys.java')
          strings_path = Path('app/src/main/res/values/strings.xml')

          main = main_path.read_text(encoding='utf-8')
          stubs = []
          declarations = [
              ('armRecoveredDirectDownloadAutoResume', '    private void armRecoveredDirectDownloadAutoResume() {\n        // Removed direct-download recovery subsystem.\n    }\n'),
              ('maybeResumeRecoveredDirectDownload', '    private void maybeResumeRecoveredDirectDownload() {\n        // Removed direct-download recovery subsystem.\n    }\n'),
              ('maybeResumeDirectDownloadAfterNetworkLoss', '    private void maybeResumeDirectDownloadAfterNetworkLoss() {\n        // Removed direct-download recovery subsystem.\n    }\n'),
          ]
          for method, body in declarations:
              if not re.search(r'\b(?:private|protected|public)\s+void\s+' + method + r'\s*\(', main):
                  stubs.append(body)
          if not re.search(r'\b(?:private|protected|public)\s+void\s+pauseDirectDownloadForNetworkLoss\s*\(\s*\)', main):
              stubs.append('    private void pauseDirectDownloadForNetworkLoss() {\n        // Removed direct-download recovery subsystem.\n    }\n')
          if not re.search(r'\b(?:private|protected|public)\s+void\s+pauseDirectDownloadForNetworkLoss\s*\(\s*boolean\b', main):
              stubs.append('    private void pauseDirectDownloadForNetworkLoss(boolean internetAvailable, boolean wifiAssociated) {\n        // Removed direct-download recovery subsystem.\n    }\n')
          if not re.search(r'\b(?:private|protected|public)\s+boolean\s+isDownloadAutoResumeWifiEnabled\s*\(', main):
              stubs.append('    private boolean isDownloadAutoResumeWifiEnabled() {\n        return true;\n    }\n')
          if stubs:
              pos = main.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Could not locate MainActivity closing brace')
              main = main[:pos] + '\n\n' + '\n'.join(stubs) + main[pos:]
              main_path.write_text(main, encoding='utf-8')

          rows = row_path.read_text(encoding='utf-8')
          root_prefix = 'public final class RowKeys {'
          root_constant = ('\n    public static final String DOWNLOAD_AUTO_RESUME_WIFI =\n'
                           '            "settings.download_auto_resume_wifi";')
          root_head = rows.split('public static final class Settings', 1)[0]
          if 'DOWNLOAD_AUTO_RESUME_WIFI' not in root_head:
              if root_prefix not in rows:
                  raise SystemExit('Could not locate RowKeys root class')
              rows = rows.replace(root_prefix, root_prefix + root_constant, 1)
          settings_match = re.search(r'(\bclass\s+Settings\s*\{)', rows)
          if not settings_match:
              raise SystemExit('Could not locate RowKeys.Settings')
          settings_tail = rows[settings_match.end():]
          if 'DOWNLOAD_AUTO_RESUME_WIFI' not in settings_tail:
              nested_constant = ('\n        public static final String DOWNLOAD_AUTO_RESUME_WIFI =\n'
                                 '                "settings.download_auto_resume_wifi";')
              rows = rows[:settings_match.end()] + nested_constant + rows[settings_match.end():]
          row_path.write_text(rows, encoding='utf-8')

          strings = strings_path.read_text(encoding='utf-8')
          values = {
              'home_menu_downloads': 'Downloads',
              'settings_download_auto_resume_title': 'Auto-resume downloads on Wi-Fi',
              'settings_download_auto_resume_summary_on': 'Downloads resume automatically on Wi-Fi',
              'settings_download_auto_resume_summary_off': 'Downloads stay paused after a connection loss',
              'settings_download_auto_resume_wifi_hint': 'Resume interrupted downloads automatically when Wi-Fi returns.',
              'settings_download_auto_resume_wifi': 'Auto-resume downloads on Wi-Fi',
          }
          additions = [
              f'    <string name="{name}">{value}</string>'
              for name, value in values.items()
              if f'name="{name}"' not in strings
          ]
          if additions:
              strings = strings.replace('</resources>', '\n' + '\n'.join(additions) + '\n</resources>')
              strings_path.write_text(strings, encoding='utf-8')

          print('Applied minimal compile compatibility patch')
          PY

      - name: Record reproducible build time
        run: echo "SOURCE_DATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-19" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y unzip zip e2fsprogs curl util-linux kmod openssl android-sdk-libsparse-utils
          sudo modprobe loop max_loop=64 || true

      - name: Fetch official AOSP test platform keys
        run: |
          mkdir -p .ci-keys
          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.pk8?format=TEXT" \
            | base64 -d > .ci-keys/platform.pk8
          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.x509.pem?format=TEXT" \
            | base64 -d > .ci-keys/platform.x509.pem
          test -s .ci-keys/platform.pk8
          test -s .ci-keys/platform.x509.pem
          echo "SOLAR_PLATFORM_KEY_PK8=$GITHUB_WORKSPACE/.ci-keys/platform.pk8" >> "$GITHUB_ENV"
          echo "SOLAR_PLATFORM_KEY_PEM=$GITHUB_WORKSPACE/.ci-keys/platform.x509.pem" >> "$GITHUB_ENV"

      - name: Prepare platform assets and keystore
        run: |
          chmod +x gradlew scripts/build.sh scripts/ensure-platform-keystore.sh scripts/env.sh \
            solar-rom/scripts/*.sh
          ./scripts/ensure-platform-keystore.sh
          ./solar-rom/scripts/sync-y1-assets.sh
          ./solar-rom/scripts/sync-platform-assets.sh

      - name: Build signed Solar APK
        run: ./scripts/build.sh

      - name: Build Y1 Type A rom.zip
        run: |
          mkdir -p dist
          if [ -z "${SOLAR_Y1A_BASE_ZIP:-}" ]; then
            export SOLAR_Y1A_BASE_ZIP="https://github.com/y1-community/y1-ata-rom/releases/download/0.1/rom.zip"
          fi
          ./solar-rom/scripts/build-rom.sh a \
            --apk app/build/outputs/apk/release/app-release.apk \
            dist/rom.zip

      - name: Verify archive
        run: |
          test -s dist/rom.zip
          unzip -t dist/rom.zip
          sha256sum dist/rom.zip | tee dist/rom.zip.sha256
          unzip -l dist/rom.zip | tee dist/rom.zip.contents.txt

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-y1-type-a-rom
          path: |
            dist/rom.zip
            dist/rom.zip.sha256
            dist/rom.zip.contents.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keys
        if: always()
        run: rm -rf .ci-keys
