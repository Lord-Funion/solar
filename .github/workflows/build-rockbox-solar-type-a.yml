name: Build Rockbox Solar Y1 Type A ROM

on:
  push:
    branches:
      - agent/rockbox-solar-firmware
  pull_request:
    branches:
      - agent/rockbox-solar-cleanroom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-type-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ROCKBOX_REF: ec32a663dfb8396080227de03846c30f07dc258d
      ROCKBOX_RELEASE_TAG: stable-v0.5
      ANDROID_SDK_PATH: /home/runner/android-sdk
      ANDROID_NDK_PATH: /home/runner/android-ndk-r10e
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r10e

    steps:
      - name: Check out Solar integration branch
        uses: actions/checkout@v4

      - name: Check out pinned Y1 Rockbox source
        uses: actions/checkout@v4
        with:
          repository: rockbox-y1/rockbox
          ref: ${{ env.ROCKBOX_REF }}
          path: rockbox-y1
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: firmware/native/solarctl/go.mod

      - name: Install build and image tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          sudo apt-get update 2>&1 | tee logs/00-apt-update.log
          sudo apt-get install -y \
            lib32z1 openjdk-17-jdk zip unzip wget curl file binutils \
            e2fsprogs util-linux rsync \
            2>&1 | tee logs/00-apt-install.log

      - name: Match official Type A package manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firmware/build_type_a.sh')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          kept = [line for line in lines if 'download.*agent' not in line]
          removed = len(lines) - len(kept)
          if removed != 2:
              raise SystemExit(f'Expected to remove two non-official DA assertions, removed {removed}')
          path.write_text(''.join(kept), encoding='utf-8')
          PY
          if grep -n 'download.*agent' firmware/build_type_a.sh; then
            echo 'DA assertion still present' >&2
            exit 1
          fi
          grep -n "scatter\|system.img\|userdata.img" firmware/build_type_a.sh

      - name: Build, package, and inspect Type A ROM
        shell: bash
        run: |
          chmod +x firmware/build_type_a.sh
          firmware/build_type_a.sh

      - name: Split verified ROM for connector download
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROM=dist/type-a/rom.zip
          PARTS=dist/type-a-download
          META=dist/type-a-metadata
          test -f "$ROM"
          unzip -tq "$ROM"
          rm -rf "$PARTS" "$META"
          mkdir -p "$PARTS" "$META"
          sha256sum "$ROM" | tee "$META/rom.zip.sha256"
          stat --printf='rom.zip bytes=%s\n' "$ROM" | tee "$META/rom.zip.size.txt"
          split -b 300M -d -a 2 "$ROM" "$PARTS/rom.zip.part-"
          test -f "$PARTS/rom.zip.part-00"
          test -f "$PARTS/rom.zip.part-01"
          test ! -f "$PARTS/rom.zip.part-02"
          sha256sum "$PARTS"/rom.zip.part-* | tee "$META/parts.sha256"
          cat > "$META/reassemble-linux-macos.sh" <<'SH'
          #!/usr/bin/env sh
          set -eu
          cat rom.zip.part-00 rom.zip.part-01 > rom.zip
          sha256sum -c rom.zip.sha256
          SH
          cat > "$META/reassemble-windows.cmd" <<'CMD'
          @echo off
          copy /b rom.zip.part-00+rom.zip.part-01 rom.zip
          certutil -hashfile rom.zip SHA256
          CMD
          chmod 0755 "$META/reassemble-linux-macos.sh"
          cp "$META/rom.zip.sha256" "$PARTS/"
          ls -l "$PARTS" "$META"

      - name: Upload Type A ROM part 00
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-solar-y1-type-a-rom-part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist/type-a-download/rom.zip.part-00
            dist/type-a-download/rom.zip.sha256

      - name: Upload Type A ROM part 01
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-solar-y1-type-a-rom-part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist/type-a-download/rom.zip.part-01
            dist/type-a-download/rom.zip.sha256

      - name: Upload Type A ROM metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-solar-y1-type-a-rom-metadata
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
          path: |
            dist/type-a-metadata/
            dist/source/
            logs/
