name: Build Rockbox Solar Y1 Type A ROM

on:
  push:
    branches:
      - agent/rockbox-solar-firmware
  pull_request:
    branches:
      - agent/rockbox-solar-cleanroom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-type-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ROCKBOX_REF: ec32a663dfb8396080227de03846c30f07dc258d
      ROCKBOX_RELEASE_TAG: stable-v0.5
      ANDROID_SDK_PATH: /home/runner/android-sdk
      ANDROID_NDK_PATH: /home/runner/android-ndk-r10e
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r10e

    steps:
      - name: Check out Solar integration branch
        uses: actions/checkout@v4

      - name: Check out pinned Y1 Rockbox source
        uses: actions/checkout@v4
        with:
          repository: rockbox-y1/rockbox
          ref: ${{ env.ROCKBOX_REF }}
          path: rockbox-y1
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: firmware/native/solarctl/go.mod

      - name: Install build and image tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          sudo apt-get update 2>&1 | tee logs/00-apt-update.log
          sudo apt-get install -y \
            lib32z1 openjdk-17-jdk zip unzip wget curl file binutils \
            e2fsprogs util-linux rsync \
            2>&1 | tee logs/00-apt-install.log

      - name: Build, package, and inspect Type A ROM
        shell: bash
        run: |
          chmod +x firmware/build_type_a.sh
          firmware/build_type_a.sh

      - name: Upload Type A ROM and complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-solar-y1-type-a-rom
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
          path: |
            dist/type-a/
            dist/source/
            logs/
