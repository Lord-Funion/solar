name: Run YouTube restore overlap fix

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-overlap:
    if: github.event.pull_request.number == 8
    runs-on: ubuntu-latest
    steps:
      - name: Check out restore branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/restore-upstream-youtube

      - name: Preserve unrelated transfer settings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/solar/launcher/RowKeys.java')
          text = path.read_text()
          key = '    public static final String DOWNLOAD_AUTO_RESUME_WIFI =\n            "settings.download_auto_resume_wifi";\n'
          if 'DOWNLOAD_AUTO_RESUME_WIFI' not in text:
              anchor = '    public static final String MEDIA = "settings.media";\n'
              if anchor not in text:
                  raise SystemExit('RowKeys MEDIA anchor missing')
              text = text.replace(anchor, anchor + key, 1)
          path.write_text(text)

          path = Path('app/src/main/java/com/solar/launcher/MainActivity.java')
          text = path.read_text()
          method = '''    private boolean isDownloadAutoResumeWifiEnabled() {
              return prefs == null || prefs.getBoolean(
                      TransferNetworkPolicy.PREF_AUTO_RESUME_WIFI, true);
          }

'''
          if 'private boolean isDownloadAutoResumeWifiEnabled()' not in text:
              anchor = '    /**\n     * 2026-07-20 — Forward API 23–28 storage grants to phone chrome (Y1/Y2 never hit this).\n'
              if anchor not in text:
                  raise SystemExit('MainActivity storage-comment anchor missing')
              text = text.replace(anchor, method + anchor, 1)

          row = '''        LinearLayout btnDownloadAutoResume = createSettingsRow(
                  RowKeys.DOWNLOAD_AUTO_RESUME_WIFI,
                  R.string.settings_download_auto_resume_wifi,
                  false);
          btnDownloadAutoResume.setOnClickListener(new View.OnClickListener() {
              @Override
              public void onClick(View v) {
                  clickFeedback();
                  boolean enabled = !isDownloadAutoResumeWifiEnabled();
                  prefs.edit().putBoolean(
                          TransferNetworkPolicy.PREF_AUTO_RESUME_WIFI, enabled).commit();
                  refreshSettingsPreview(RowKeys.DOWNLOAD_AUTO_RESUME_WIFI);
                  if (enabled) {
                      maybeResumePodcastDownload();
                      maybeResumeSoulseekDownloadAfterNetworkLoss();
                  }
              }
          });
          containerSettingsItems.addView(btnDownloadAutoResume);

'''
          if 'LinearLayout btnDownloadAutoResume = createSettingsRow(' not in text:
              anchor = '        // 2026-07-19 — Enable Stem features: boolean toggle like Deezer Enable (not a submenu drill).\n'
              if anchor not in text:
                  raise SystemExit('MainActivity stem-settings anchor missing')
              text = text.replace(anchor, row + anchor, 1)
          path.write_text(text)

          path = Path('app/src/main/res/values/strings.xml')
          text = path.read_text()
          if 'name="settings_download_auto_resume_wifi"' not in text:
              anchor = '    <string name="settings_sub_media">Settings: Media</string>\n'
              addition = ('    <string name="settings_download_auto_resume_wifi">Resume downloads on Wi-Fi</string>\n'
                          '    <string name="settings_download_auto_resume_wifi_hint">Automatically resumes a download only when Solar paused it because Wi-Fi was lost. Manually paused downloads stay paused.</string>\n')
              if anchor not in text:
                  raise SystemExit('strings media anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          if 'name="home_menu_downloads"' not in text:
              anchor = '    <string name="home_menu_podcasts">Podcasts</string>\n'
              if anchor not in text:
                  raise SystemExit('strings podcasts anchor missing')
              text = text.replace(anchor, anchor + '    <string name="home_menu_downloads">Downloads</string>\n', 1)
          path.write_text(text)

          path = Path('app/src/main/AndroidManifest.xml')
          text = path.read_text().replace(
              '        <!-- API 17 adb backup cannot selectively exclude OAuth/Soulseek credentials. -->\n',
              '')
          path.write_text(text)
          PY

          rm -f .github/workflows/fix-youtube-restore-overlap.yml

          grep -q 'DOWNLOAD_AUTO_RESUME_WIFI' app/src/main/java/com/solar/launcher/RowKeys.java
          grep -q 'private boolean isDownloadAutoResumeWifiEnabled()' app/src/main/java/com/solar/launcher/MainActivity.java
          grep -q 'settings_download_auto_resume_wifi' app/src/main/res/values/strings.xml
          grep -q 'home_menu_downloads' app/src/main/res/values/strings.xml
          ! grep -q 'OAuth/Soulseek credentials' app/src/main/AndroidManifest.xml
          ! grep -R 'YOUTUBE_OAUTH_CLIENT_ID\|YOUTUBE_DATA_API_KEY' -n app/src app/build.gradle
          test -f app/src/main/java/com/solar/launcher/youtube/api/PipedBackend.java
          test -f app/src/main/java/com/solar/launcher/youtube/api/InvidiousBackend.java
          test ! -e app/src/main/java/com/solar/launcher/youtube/official/YouTubeDeviceAuth.java
          test ! -e app/src/main/java/com/solar/launcher/youtube/YouTubeDiscoverRanker.java
          test ! -e docs/YOUTUBE-SETUP.md

          git add -A
          git commit -m "Preserve unrelated download recovery settings"
          git push origin HEAD:agent/restore-upstream-youtube

      - name: Check out main for cleanup
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: cleanup-main

      - name: Remove temporary helper from main
        shell: bash
        working-directory: cleanup-main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-youtube-restore-overlap-fix.yml
          git commit -m "Remove temporary YouTube restore helper"
          git push origin HEAD:main
