# Rockbox Solar native configuration
# Secrets are stored as plain text because the Y1 Rockbox port has no secure
# credential vault. Protect the player and do not share this file.

piped-instance: https://pipedapi.kavin.rocks
deezer-api: https://api.deezer.com
download-dir: /sdcard/Music/RockboxSolar
ca-cert: /data/solar-cacert.pem

# Optional Soulseek access through an existing slskd server.
slskd-url:
slskd-api-key:

# Optional SSH and secure file-transfer settings.
ssh-host:
ssh-port: 22
ssh-user:
ssh-password:
ssh-key:
ssh-known-hosts: /sdcard/.ssh/known_hosts
ssh-insecure-accept-host-key: false

# Optional LALAL.AI key. Stem splitting may consume paid processing minutes.
lalal-key:
